[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-permission-policy-compiler"
version = "0.1.0"
description = "Compile policy-tagged OpenCode markdown agents into explicit permission metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.10.0",
    "json5>=0.12.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
opencode-permission-policy-compiler = "opencode_permission_policy_compiler.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "pytest>=8.4.0",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_permission_policy_compiler"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.deptry]
known_first_party = ["opencode_permission_policy_compiler"]
extend_exclude = ["vulture_whitelist.py"]
